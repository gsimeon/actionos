name: ActionOS Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-24.04

    env:
      ACTIONOS_RUNTIME_MODE: demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://demo-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: demo-publishable-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Unit & Cryptographic Non-Repudiation Test Suite
        run: npm run test:unit

      - name: Protected Integration Stage (Supabase RLS, Tenant Isolation, RPC & Webhooks)
        run: npm run test:integration

      - name: Security Invariant, Ledger Privacy & Database Migration Suite
        run: npm run test:security

      - name: ActionOS Reliability Gate: Database Invariants & Migration Verification
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: npm run db:verify

      - name: Next.js Production Build
        run: npm run build
