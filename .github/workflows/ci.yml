name: ActionOS Continuous Integration

on:
  push:
    branches: [main, fix/reliability-gate-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate_mode:
        description: "Reliability Gate Mode (staging-required or offline)"
        required: false
        default: "staging-required"
        type: choice
        options:
          - "staging-required"
          - "offline"

jobs:
  verify:
    name: Typecheck, Lint, Test & Build (PR / Local Checks)
    runs-on: ubuntu-24.04

    env:
      ACTIONOS_RUNTIME_MODE: demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://demo-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: demo-publishable-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Unit & Cryptographic Non-Repudiation Test Suite
        run: npm run test:unit

      - name: Protected Integration Stage (Supabase RLS, Tenant Isolation, RPC & Webhooks)
        run: npm run test:integration

      - name: Security Invariant, Ledger Privacy & Database Migration Suite
        run: npm run test:security

      - name: "ActionOS Reliability Gate (Offline Invariant Mode)"
        env:
          RELIABILITY_GATE_MODE: offline
        run: npm run db:verify:offline

      - name: Archive Offline Reliability Gate Machine-Readable Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-gate-offline-report
          path: reliability-gate-report.json
          if-no-files-found: ignore

      - name: Next.js Production Build
        run: npm run build

  staging-verification:
    name: Live Supabase Staging Reliability Gate
    needs: [verify]
    # Executes automatically when staging credentials are present in repository, or via manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: "ActionOS Reliability Gate (Enforced Mode)"
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          RELIABILITY_GATE_MODE: ${{ github.event.inputs.gate_mode || 'staging-required' }}
        run: node scripts/verify-supabase-staging.mjs --mode=${{ github.event.inputs.gate_mode || 'staging-required' }}

      - name: Archive Live Staging Verification Machine-Readable Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-gate-staging-report
          path: reliability-gate-report.json
          if-no-files-found: ignore
